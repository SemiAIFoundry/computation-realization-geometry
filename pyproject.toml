[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crg-research-validation"
version = "1.0.0"
description = "Validation tooling for the public Computation-Realization Geometry research corpus"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE", "LICENSE_SCOPE.tsv", "LICENSES/*.txt"]
authors = [
  {name = "Fitih M. Cinnor", email = "fcinnor@semiaifoundry.com"},
]
dependencies = [
  "numpy==2.5.2",
  "pandas==2.2.3",
  "matplotlib==3.10.8",
  "scipy==1.17.0",
  "pytest==9.0.3",
]
keywords = [
  "computation-realization geometry",
  "safe commitment",
  "reproducible research",
]

[project.urls]
Repository = "https://github.com/SemiAIFoundry/computation-realization-geometry"
Research = "https://github.com/SemiAIFoundry/computation-realization-geometry"
Commercial-Licensing = "https://semiaifoundry.com/contact/"

[project.scripts]
crg-validation = "crg_validation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "validation/retention/tests", "validation/routed_heterogeneous_integration/tests"]
addopts = "-q -p no:cacheprovider"
